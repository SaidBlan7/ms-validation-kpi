openapi: 3.0.3
info:
  title: GBC 2.0 KPI Validation Service
  version: 0.15.0
  description: Specs 01-07 KPI Validation plus KPI Manuales Specs 01-03. Manual capture is isolated from Validation/Approval KPI; Spec 02 scope/assignment uses canonical security history, Spec 03 defines the exact plant-local rolling 96-hour date-selection policy, and Spec 01 PostgreSQL capture persistence remains fail-closed until the canonical Manual KPI business entity exists.
paths:
  /api/v1/manual-kpis/policy:
    get:
      summary: Returns KPI Manuales Spec 01 policy and readiness
      responses:
        '200': { description: Manual KPI policy }
  /api/v1/manual-kpis/date-selection:
    get:
      summary: Evaluates whether a plant-local business date is selectable for a new Manual KPI capture
      description: Uses the plant-local start of businessDate as the reference instant. The inclusive rolling window is exactly 96 hours. Weekends and holidays are not filtered. OEE uses a fixed 24-hour interval from the resolved plant-local day start, including DST transition dates. This endpoint does not require Manual KPI capture persistence to exist.
      parameters:
        - { in: query, name: plantId, required: true, schema: { type: integer, format: int64 } }
        - { in: query, name: lineId, required: true, schema: { type: integer, format: int64 } }
        - { in: query, name: businessDate, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Date selection decision, including target 24-hour period and window boundaries }
        '401': { description: Authentication required }
        '403': { description: Plant/line/capability scope denied }
        '400': { description: Invalid plant/line/date or timezone data }
  /api/v1/manual-kpis:
    get:
      summary: Gets one manual daily KPI record
      parameters:
        - { in: query, name: plantId, required: true, schema: { type: integer, format: int64 } }
        - { in: query, name: lineId, required: true, schema: { type: integer, format: int64 } }
        - { in: query, name: businessDate, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Manual KPI record }
        '401': { description: Authentication required }
        '403': { description: Plant/line/capability scope denied }
        '404': { description: Manual KPI record not found }
    put:
      summary: Creates or updates the daily Manual KPI capture inside the 8-hour edit window
      description: For a new daily record, validates the exact inclusive 96-hour plant-local date-selection window plus canonical scope/catalogs, feature activation and non-negative values. For an existing record, the independent 8-hour window from first save remains authoritative even if the business date has since crossed outside the 96-hour selection window. Automatic data has precedence downstream while the manual record remains traceable. PostgreSQL/Lakebase returns 503 until Data provides the canonical Manual KPI persistence entity; memory mode is fully operational.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plantId, lineId, businessDate]
              properties:
                plantId: { type: integer, format: int64 }
                lineId: { type: integer, format: int64 }
                businessDate: { type: string, format: date }
                oee:
                  type: object
                  properties:
                    stopTimes:
                      type: array
                      items:
                        type: object
                        required: [stopClassificationId, seconds]
                        properties:
                          stopClassificationId: { type: integer, format: int64 }
                          seconds: { type: integer, format: int64, minimum: 0 }
                    performance:
                      type: array
                      items:
                        type: object
                        required: [metricDefinitionId, value, uomId]
                        properties:
                          metricDefinitionId: { type: integer, format: int64 }
                          value: { type: number, minimum: 0 }
                          uomId: { type: integer, format: int64 }
                waste:
                  type: object
                  properties:
                    entries:
                      type: array
                      items:
                        type: object
                        required: [wasteClassificationId, kilograms]
                        properties:
                          wasteClassificationId: { type: integer, format: int64 }
                          wasteSubclassificationId: { type: integer, format: int64, nullable: true }
                          kilograms: { type: number, minimum: 0 }
                    producedTonnes: { type: number, minimum: 0 }
      responses:
        '200': { description: Manual KPI record created or updated }
        '400': { description: Invalid request }
        '401': { description: Authentication required }
        '403': { description: Plant/line/capability scope denied }
        '422': { description: Business rule violation, including expired edit window }
        '503': { description: Canonical Manual KPI persistence is not yet available in PostgreSQL/Lakebase }
  /api/v1/manual-kpis/scope/me:
    get:
      summary: Returns the effective KPI Manuales plants and enabled lines for the authenticated superuser
      description: Intersects current generic plant access, current line access, current line-to-plant assignment, plant/line active state, KPI Manuales role/capability and effective feature activation.
      responses:
        '200': { description: Effective plant/line scope }
        '401': { description: Authentication required }
  /api/v1/manual-kpis/scope/policy:
    get:
      summary: Returns Spec 02 scope and revocation policy
      responses:
        '200': { description: Manual KPI scope policy }
  /api/v1/manual-kpis/scope/admin/assignments:
    get:
      summary: Lists KPI Manuales role assignment history for a plant
      parameters:
        - { in: query, name: plantId, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Assignment history }
        '403': { description: Scope administration capability required }
    post:
      summary: Assigns KPI Manuales scope for one superuser and plant
      description: Creates a plant-scoped user_role_assignment for the configured KPI Manuales role. The target must already have current generic user_plant_access for the plant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetUserId, plantId]
              properties:
                targetUserId: { type: integer, format: int64 }
                plantId: { type: integer, format: int64 }
                reason: { type: string }
      responses:
        '200': { description: Assignment created }
        '403': { description: Scope administration capability required }
        '409': { description: Duplicate assignment or missing generic plant access }
    delete:
      summary: Revokes KPI Manuales scope for one superuser and plant
      description: Closes valid_to on the effective plant-scoped KPI Manuales role assignment; historical records keep the original actor identity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetUserId, plantId, reason]
              properties:
                targetUserId: { type: integer, format: int64 }
                plantId: { type: integer, format: int64 }
                reason: { type: string }
      responses:
        '200': { description: Assignment revoked }
        '403': { description: Scope administration capability required }
        '409': { description: No effective assignment exists }
  /api/v1/oee-validation/capabilities:
    get:
      summary: Shows implemented and pending KPI Validation capabilities
      responses:
        '200': { description: OK }
        '401': { description: Authentication required }
  /api/v1/oee-validation/justification/policy:
    get:
      summary: Returns the current Spec 06 justification policy
      description: Declares allowed reasons and required evidence. Optional per-field maximum lengths and an optional incident regex are enforced when configured; GB Support online validation and sensitive-data policy remain pending.
      responses:
        '200': { description: Justification policy }
        '401': { description: Authentication required }
  /api/v1/oee-validation/audit/policy:
    get:
      summary: Returns the current Spec 07 validator/timestamp evidence policy
      description: Uses Entra tid+oid as immutable actor identity and resolves app_security.user_identity.user_id in canonical DB modes. Spec 01 persists proposed_by_user_id/proposed_at and Spec 02 assignment writes feed audit.change_log through canonical triggers. Presentation uses core.plant.timezone_name while preserving the absolute Instant. The service does not delete validation/audit evidence; Approval and Reporting reconcile the canonical proposed_by_user_id/proposed_at values.
      responses:
        '200': { description: Audit evidence policy }
        '401': { description: Authentication required }
  /api/v1/oee-validation/workflow/policy:
    get:
      summary: Returns the semantic Spec 01 validation workflow contract
      description: Declares canonical states PENDING, APPROVED, REJECTED and EXPIRED. New Spec 01 proposals persist as PENDING using KPI_RESULT_ID as source identity. Approval/rejection/application remain owned by the Approval KPI module.
      responses:
        '200': { description: Workflow contract policy }
        '401': { description: Authentication required }
  /api/v1/oee-validation/assignments/policy:
    get:
      summary: Returns the Spec 02 KPI OEE validator assignment policy
      description: Declares validator role/capability plus the administration capability, plant-specific scope, max two effective validators, external approval evidence, indefinite validity until explicit revocation, multi-plant support, transactional concurrency control and revocation semantics.
      responses:
        '200': { description: Validator assignment policy }
        '401': { description: Authentication required }
  /api/v1/oee-validation/assignments/me:
    get:
      summary: Returns the effective KPI plant assignments for the authenticated validator
      description: In PostgreSQL/Lakebase, resolves current plant-scoped user_role_assignment for the configured role/capability and only returns plants that also have current generic plant access. Each returned plant includes effectiveValidatorCount, remainingSlots and overLimit. The effective count requires both current KPI role/capability assignment and current user_plant_access. In memory mode, uses the explicit local fixture.
      responses:
        '200': { description: Effective KPI assignments }
        '401': { description: Authentication required }
        '403': { description: Actor does not have the dedicated KPI validator entitlement }
  /api/v1/oee-validation/assignments:
    get:
      summary: Lists canonical KPI validator assignment history for one plant
      description: Requires the configured assignment-administration capability in global scope or the requested plant scope.
      parameters:
        - { in: query, name: plantId, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Assignment history }
        '401': { description: Authentication required }
        '403': { description: Assignment administrator capability required }
    post:
      summary: Assigns a plant to an approved KPI OEE superuser
      description: Requires an externalApprovalReference because Direction Global approval remains outside GBC. The target user must be active and have current generic plant access. The transaction serializes by plant and rejects a third effective validator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetUserId, plantId, externalApprovalReference]
              properties:
                targetUserId: { type: integer, format: int64 }
                plantId: { type: integer, format: int64 }
                externalApprovalReference: { type: string }
                reason: { type: string }
      responses:
        '201': { description: Assignment created }
        '400': { description: Invalid request/reference data }
        '401': { description: Authentication required }
        '403': { description: Assignment administrator capability required }
        '409': { description: Duplicate assignment, missing generic plant access, or plant already has two validators }
  /api/v1/oee-validation/assignments/{targetUserId}/plants/{plantId}:
    patch:
      summary: Modifies approval evidence/reason for an effective KPI OEE plant assignment
      parameters:
        - { in: path, name: targetUserId, required: true, schema: { type: integer, format: int64 } }
        - { in: path, name: plantId, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [externalApprovalReference]
              properties:
                externalApprovalReference: { type: string }
                reason: { type: string }
      responses:
        '200': { description: Assignment modified }
        '403': { description: Assignment administrator capability required }
        '409': { description: Effective assignment not found or canonical data conflict }
  /api/v1/oee-validation/assignments/{targetUserId}/plants/{plantId}/revoke:
    post:
      summary: Revokes an effective KPI OEE plant assignment
      description: Closes user_role_assignment.valid_to at the current instant. Existing PENDING KPI validations remain persisted and immutable; revocation only removes future validator access.
      parameters:
        - { in: path, name: targetUserId, required: true, schema: { type: integer, format: int64 } }
        - { in: path, name: plantId, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200': { description: Assignment revoked }
        '403': { description: Assignment administrator capability required }
        '409': { description: Effective assignment not found }
  /api/v1/oee-validation/temporal-context:
    get:
      summary: Returns the server-authoritative temporal context for KPI OEE validation
      description: Returns plant-local current date/time, the only editable business date (calendar D-1), and the local window in which that D-1 remains current. Weekends and holidays are never skipped and no business-day calendar is consulted. eligibilityWindowEndsAtExclusive is the next plant-local midnight; the server recalculates D-1 on every protected read/prevalidation and again before persistence, so a screen or saved URL that crosses midnight becomes stale. The temporal rule is closed as plant-local calendar D-1 (00:00 to 00:00) using core.plant.timezone_name; it is not a rolling elapsed-24-hour window.
      parameters:
        - { in: query, name: plantId, required: true, schema: { type: integer, format: int64 } }
        - { in: query, name: lineId, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Temporal context }
        '400': { description: Invalid plant/line request }
        '401': { description: Authentication required }
        '403': { description: Actor is not authorized for the requested KPI plant scope }
  /api/v1/oee-validation/eligibility:
    get:
      summary: Checks whether actor/plant/line/date are eligible for OEE validation
      description: Recalculates calendar D-1 on every request using the configured plant timezone. Saturday, Sunday and holidays are treated exactly like any other calendar day. Any date other than D-1 is rejected, so a stale URL or screen cannot remain editable after plant-local midnight; invalid timezone configuration is returned as a controlled blocker.
      parameters:
        - { in: query, name: plantId, required: true, schema: { type: integer, format: int64 } }
        - { in: query, name: lineId, required: true, schema: { type: integer, format: int64 } }
        - { in: query, name: businessDate, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Eligibility result }
        '401': { description: Authentication required }
        '403': { description: Actor is not authorized for the requested KPI plant scope }
  /api/v1/oee-validation/oee/reference:
    get:
      summary: Returns the canonical previous-day line-level KPI result used as the original value
      description: Resolves metricCode as kpi.kpi_definition.kpi_code and reads the latest kpi.kpi_result whose plant/line match, optional shift/product/execution dimensions are null, and period_start/period_end exactly match the authoritative plant-local D-1 calendar window. No OEE code or aggregation fallback is inferred.
      parameters:
        - { in: query, name: plantId, required: true, schema: { type: integer, format: int64 } }
        - { in: query, name: lineId, required: true, schema: { type: integer, format: int64 } }
        - { in: query, name: businessDate, required: true, schema: { type: string, format: date } }
        - { in: query, name: metricCode, required: true, schema: { type: string }, description: Must match canonical kpi.kpi_definition.kpi_code }
      responses:
        '200': { description: Canonical OEE/KPI original-value reference }
        '401': { description: Authentication required }
        '403': { description: Actor is not authorized for the requested KPI plant scope }
  /api/v1/oee-validation/prevalidate:
    post:
      summary: Validates available OEE correction rules including Spec 06 justification and Spec 07 audit evidence without persisting a proposal
      description: Revalidates D-1 and justification on every request, resolves originalValue again from canonical kpi.kpi_result, checks that proposedValue differs, and checks whether the kpi_result already has a validation. A valid response is ready for submission with target status PENDING.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plantId, lineId, businessDate, metricCode, proposedValue, reasonType]
              properties:
                plantId: { type: integer, format: int64 }
                lineId: { type: integer, format: int64 }
                businessDate: { type: string, format: date }
                metricCode: { type: string, description: Canonical kpi.kpi_definition.kpi_code; official OEE 1/OEE 2/full codes are not hardcoded }
                proposedValue: { type: number }
                reasonType: { type: string, enum: [OPERATIVE, SYSTEM], description: Only the two confirmed Spec 06 reasons are accepted }
                incidentNumber: { type: string, description: Required only for SYSTEM; normalized single-line text, maximum 200 Unicode characters; capture-only, with no regex or online GB Support validation }
                operationalCause: { type: string, description: Required only for OPERATIVE; normalized free text, maximum 2000 Unicode characters }
                actionPlan: { type: string, description: Required only for OPERATIVE; normalized free text, maximum 2000 Unicode characters }
      responses:
        '200': { description: Prevalidation result }
        '400': { description: Invalid request }
        '401': { description: Authentication required }
        '403': { description: Actor is not authorized for the requested KPI plant scope }
  /api/v1/oee-validation/validations:
    post:
      summary: Creates the Spec 01 OEE validation proposal
      description: Revalidates all Spec 01 rules server-side and atomically persists kpi.kpi_validation plus kpi.kpi_validation_detail as PENDING. Concurrent submissions for the same kpi_result_id are serialized with a PostgreSQL advisory transaction lock and re-check, enforcing one proposal opportunity per canonical KPI result through this service. The stored original_value is the immutable evidence snapshot even if the source KPI is recalculated later. expires_at is the end of the plant-local proposal day.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plantId, lineId, businessDate, metricCode, proposedValue, reasonType]
              properties:
                plantId: { type: integer, format: int64 }
                lineId: { type: integer, format: int64 }
                businessDate: { type: string, format: date }
                metricCode: { type: string }
                proposedValue: { type: number }
                reasonType: { type: string, enum: [OPERATIVE, SYSTEM] }
                incidentNumber: { type: string }
                operationalCause: { type: string }
                actionPlan: { type: string }
      responses:
        '200': { description: Validation proposal persisted as PENDING }
        '400': { description: Invalid request }
        '401': { description: Authentication required }
        '403': { description: Scope/entitlement denied }
        '409': { description: The KPI result already has a validation proposal }
        '422': { description: Spec 01 business rules are not satisfied }
  /api/v1/oee-validation/validations/{validationId}:
    get:
      summary: Returns Spec 01 validation traceability detail
      parameters:
        - { in: path, name: validationId, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Validation detail including original/proposed values, reason, actor and timestamps }
        '401': { description: Authentication required }
        '403': { description: Scope/entitlement denied }
        '404': { description: Validation not found }
  /api/v1/oee-validation/stop-times/policy:
    get:
      summary: Returns the current Spec 04 stop-time validation policy
      description: Declares the canonical source, aggregate identity, canonical oee_stop_type_code classification, historical inactive-classification handling, server-side original reconciliation, one-classification-per-validation closure policy, persistence state, and the still-open cross-classification total-time formula.
      responses:
        '200': { description: Stop-time policy }
        '401': { description: Authentication required }
  /api/v1/oee-validation/stop-times/reference:
    get:
      summary: Returns D-1 stop-time totals grouped by canonical v1.2 stop classification
      description: Reconstruction from stops.stop_event + stops.stop_fragment clipped to the selected D-1 window and classified through stops.classification_history. Observed classifications remain visible even if currently inactive. programmingType comes from canonical stops.stop_classification.oee_stop_type_code; only PROGRAMMED/UNPROGRAMMED classifications are editable in Spec 04.
      parameters:
        - { in: query, name: plantId, required: true, schema: { type: integer, format: int64 } }
        - { in: query, name: lineId, required: true, schema: { type: integer, format: int64 } }
        - { in: query, name: businessDate, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Canonical v1.2 stop-time totals by observed classification }
        '400': { description: Invalid date/scope request }
        '401': { description: Authentication required }
        '403': { description: Actor is not authorized for the requested KPI plant scope }
  /api/v1/oee-validation/stop-times/prevalidate:
    post:
      summary: Prevalidates one Spec 04 stop-time correction
      description: Revalidates D-1/security/classification scope, reloads the canonical line/date/classification aggregate, requires canonical oee_stop_type_code PROGRAMMED or UNPROGRAMMED, blocks stale/manipulated originalSeconds, rejects negative or unchanged values, validates justification, checks the one-opportunity rule, and returns readiness for durable PENDING submission. Each request represents exactly one classification correction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plantId, lineId, businessDate, stopClassificationId, originalSeconds, proposedSeconds, reasonType]
              properties:
                plantId: { type: integer, format: int64 }
                lineId: { type: integer, format: int64 }
                businessDate: { type: string, format: date }
                stopClassificationId: { type: integer, format: int64 }
                originalSeconds: { type: integer, format: int64, minimum: 0, description: Must match the server-observed D-1 aggregate returned by /stop-times/reference }
                proposedSeconds: { type: integer, format: int64, minimum: 0 }
                reasonType: { type: string, enum: [OPERATIVE, SYSTEM], description: Only the two confirmed Spec 06 reasons are accepted }
                incidentNumber: { type: string, description: Required only for SYSTEM; normalized single-line text, maximum 200 Unicode characters; capture-only, with no regex or online GB Support validation }
                operationalCause: { type: string, description: Required only for OPERATIVE; normalized free text, maximum 2000 Unicode characters }
                actionPlan: { type: string, description: Required only for OPERATIVE; normalized free text, maximum 2000 Unicode characters }
      responses:
        '200': { description: Stop-time correction prevalidation result }
        '400': { description: Invalid request }
        '401': { description: Authentication required }
        '403': { description: Actor is not authorized for the requested KPI plant scope }
  /api/v1/oee-validation/stop-times/validations:
    post:
      summary: Creates one Spec 04 stop-time validation proposal
      description: Revalidates the complete Spec 04 request server-side and atomically persists one classification correction as kpi.kpi_validation plus kpi.kpi_validation_detail with stop_classification_id in PENDING. Multiple classification corrections are separate validation proposals. Concurrent submissions for the same line/date/classification are serialized by PostgreSQL advisory lock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plantId, lineId, businessDate, stopClassificationId, originalSeconds, proposedSeconds, reasonType]
              properties:
                plantId: { type: integer, format: int64 }
                lineId: { type: integer, format: int64 }
                businessDate: { type: string, format: date }
                stopClassificationId: { type: integer, format: int64 }
                originalSeconds: { type: integer, format: int64, minimum: 0 }
                proposedSeconds: { type: integer, format: int64, minimum: 0 }
                reasonType: { type: string, enum: [OPERATIVE, SYSTEM] }
                incidentNumber: { type: string }
                operationalCause: { type: string }
                actionPlan: { type: string }
      responses:
        '201': { description: Stop-time validation persisted as PENDING }
        '400': { description: Invalid request }
        '401': { description: Authentication required }
        '403': { description: Scope/entitlement denied }
        '409': { description: This line/date/classification already has a validation proposal }
        '422': { description: Spec 04 business rules are not satisfied }
  /api/v1/oee-validation/stop-times/validations/{validationId}:
    get:
      summary: Returns Spec 04 stop-time validation traceability
      parameters:
        - { in: path, name: validationId, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Stop-time validation detail including classification, original/proposed seconds, reason, actor and timestamps }
        '401': { description: Authentication required }
        '403': { description: Scope/entitlement denied }
        '404': { description: Stop-time validation not found }
  /api/v1/oee-validation/masses/policy:
    get:
      summary: Returns the current Spec 05 mass-performance validation policy
      description: Declares source mode, configurable semantic derived-metric codes, line/date/variable/UOM aggregate identity, canonical MASS-UOM rule, server-side original reconciliation, scheduling fallback status, and the functional rules still pending definition/persistence.
      responses:
        '200': { description: Mass-performance policy }
        '401': { description: Authentication required }
  /api/v1/oee-validation/masses/reference:
    get:
      summary: Returns previous-day elaborated/delivered mass references by line variable and UOM
      description: Canonical D-1 reference. ELABORATED_MASS is aggregated from scheduling.batch_execution for dough manufacturing executions. DELIVERED_MASS is aggregated from scheduling.finished_product_output and converted through a vigente manufacturing.packaging_conversion when the captured UOM is not already MASS. Units are never mixed.
      parameters:
        - { in: query, name: plantId, required: true, schema: { type: integer, format: int64 } }
        - { in: query, name: lineId, required: true, schema: { type: integer, format: int64 } }
        - { in: query, name: businessDate, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Canonical mass references for D-1 }
        '400': { description: Invalid date/scope request }
        '401': { description: Authentication required }
        '403': { description: Actor is not authorized for the requested KPI plant scope }
  /api/v1/oee-validation/masses/prevalidate:
    post:
      summary: Prevalidates one Spec 05 mass correction plus Specs 06-07 evidence before persistence
      description: Validates D-1/security scope, canonical MASS UOM, variable, decimal non-negative values and reason details. The backend reloads the current line/date/variable/UOM reference and blocks a stale or manipulated originalValue. A missing source row is not treated as zero because Spec 05 is a correction flow, not KPI Manual capture. Responses include sourceAggregateKey, sourceType, normalized justification, auditEvidence and targetStatusIfPersisted=PENDING. Values are validated independently, canonical decimals are preserved without extra application rounding, and persistence uses kpi_validation_detail.metric_definition_id. If the automatic source changes after persistence, the stored original remains immutable evidence for Approval KPI.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plantId, lineId, businessDate, uomId, variable, originalValue, proposedValue, reasonType]
              properties:
                plantId: { type: integer, format: int64 }
                lineId: { type: integer, format: int64 }
                businessDate: { type: string, format: date }
                uomId: { type: integer, format: int64, description: Canonical core.unit_of_measure with dimension_code=MASS }
                variable: { type: string, enum: [ELABORATED_MASS, DELIVERED_MASS] }
                originalValue: { type: number, minimum: 0, description: Must match the server-observed D-1 reference returned by /masses/reference }
                proposedValue: { type: number, minimum: 0 }
                reasonType: { type: string, enum: [OPERATIVE, SYSTEM], description: Only the two confirmed Spec 06 reasons are accepted }
                incidentNumber: { type: string, description: Required only for SYSTEM; normalized single-line text, maximum 200 Unicode characters; capture-only, with no regex or online GB Support validation }
                operationalCause: { type: string, description: Required only for OPERATIVE; normalized free text, maximum 2000 Unicode characters }
                actionPlan: { type: string, description: Required only for OPERATIVE; normalized free text, maximum 2000 Unicode characters }
      responses:
        '200': { description: Mass correction prevalidation result }
        '400': { description: Invalid request }
        '401': { description: Authentication required }
        '403': { description: Actor is not authorized for the requested KPI plant scope }
  /api/v1/oee-validation/masses/validations:
    post:
      summary: Submits a Spec 05 mass correction
      description: Re-runs server-side prevalidation and persists one PENDING proposal in kpi.kpi_validation plus kpi.kpi_validation_detail. metric_definition_id identifies ELABORATED_MASS or DELIVERED_MASS durably.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plantId, lineId, businessDate, uomId, variable, originalValue, proposedValue, reasonType]
              properties:
                plantId: { type: integer, format: int64 }
                lineId: { type: integer, format: int64 }
                businessDate: { type: string, format: date }
                uomId: { type: integer, format: int64 }
                variable: { type: string, enum: [ELABORATED_MASS, DELIVERED_MASS] }
                originalValue: { type: number, minimum: 0 }
                proposedValue: { type: number, minimum: 0 }
                reasonType: { type: string, enum: [OPERATIVE, SYSTEM] }
                incidentNumber: { type: string }
                operationalCause: { type: string }
                actionPlan: { type: string }
      responses:
        '201': { description: Reserved for a future canonical data model that can persist the mass variable identity }
        '400': { description: Invalid/stale request }
        '422': { description: Current canonical schema cannot durably persist the mass-variable identity; prevalidation remains available }
        '401': { description: Authentication required }
        '403': { description: Actor is not authorized for the requested KPI plant scope }
  /api/v1/oee-validation/masses/validations/{validationId}:
    get:
      summary: Reserved Spec 05 persisted-validation lookup (current canonical schema has no durable mass-variable identity)
      parameters:
        - { in: path, name: validationId, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Reserved for future canonical persisted mass validation detail }
        '401': { description: Authentication required }
        '403': { description: Scope/entitlement denied }
        '404': { description: Mass validation not found }
  /api/v1/health:
    get:
      summary: DB connectivity health
      responses: { '200': { description: UP }, '503': { description: DOWN } }
